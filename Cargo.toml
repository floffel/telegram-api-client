[package]
name = "telegram-api-client"
version = "0.1.7"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0 OR MIT"
description = "Minimal typed client and webhook toolkit for the Telegram Bot API"
repository = "https://github.com/floffel/telegram-api-client"
documentation = "https://docs.rs/telegram-api-client"
keywords = ["telegram", "bot", "api", "webhook"]
categories = ["api-bindings", "web-programming"]
readme = "README.md"
exclude = [".github/**", "deny.toml", "fuzz/**"]

# docs.rs must render the full surface: the reqwest transport behind `http` and
# the offline MockTransport path alike.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["http"]
http = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.11"
hex = "0.4"
subtle = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"], optional = true }
futures-timer = "3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
futures = { version = "0.3", default-features = false, features = ["executor"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"

# Examples are part of the package: `cargo build --examples --all-features` is a
# named CI gate, and the two that talk to the Bot API say so, so
# `--no-default-features` does not try to build them without `http`.
[[example]]
name = "send_text"
required-features = ["http"]

[[example]]
name = "poll_once"
required-features = ["http"]

[[example]]
name = "poll_loop"
required-features = ["http"]
