name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # `--all-targets` compiles the examples anyway; this step makes them a
      # named gate so a broken example fails under its own name.
      - name: Examples build
        run: cargo build --examples --all-features
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The threshold is a gate, not a report: a drop below 95 % fails the run.
      - run: cargo llvm-cov --all-features --fail-under-lines 95 --summary-only

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The MSRV in Cargo.toml (`rust-version`) and in the README is a promise to
  # consumers. This job compiles the crate on exactly that toolchain, so a
  # dependency that silently raises its own MSRV turns the build red here
  # instead of in a consumer's CI.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned toolchain matches the manifest
        run: |
          declared=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          if [ "$declared" != "1.89" ]; then
            echo "::error::Cargo.toml declares rust-version $declared but this job pins 1.89 - update both"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-targets --all-features
      - run: cargo check --no-default-features

  # The four fuzz targets are a gate, not a nightly chore: a target that stops
  # compiling, or starts panicking on its seed corpus, turns this job red.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      # taiki-e/install-action has no recipe for cargo-fuzz: the shim reported
      # success and installed nothing, so the next step died with "no such
      # command: fuzz". Build the tool explicitly instead.
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # `fuzz/` is a standalone crate: the library's fmt/clippy jobs do not
      # reach it, so it is linted here.
      - name: Fuzz crate formatting
        working-directory: fuzz
        run: cargo fmt --check
      - name: Fuzz crate lints
        working-directory: fuzz
        run: cargo clippy --all-targets -- -D warnings
      - name: Fuzz targets compile
        working-directory: fuzz
        run: cargo fuzz build
      - name: Every target smokes on its seed corpus
        working-directory: fuzz
        run: |
          set -e
          for target in update webhook multipart retry_hint; do
            echo "::group::$target"
            cargo fuzz run "$target" "seeds/$target" -- -max_total_time=20 -rss_limit_mb=2048
            echo "::endgroup::"
          done
