name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test --no-default-features
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # The threshold is a gate, not a report: a drop below 95 % fails the run.
      - run: cargo llvm-cov --all-features --fail-under-lines 95 --summary-only

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # The MSRV in Cargo.toml (`rust-version`) and in the README is a promise to
  # consumers. This job compiles the crate on exactly that toolchain, so a
  # dependency that silently raises its own MSRV turns the build red here
  # instead of in a consumer's CI.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned toolchain matches the manifest
        run: |
          declared=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].rust_version')
          if [ "$declared" != "1.89" ]; then
            echo "::error::Cargo.toml declares rust-version $declared but this job pins 1.89 - update both"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo check --all-targets --all-features
      - run: cargo check --no-default-features
